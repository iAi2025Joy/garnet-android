```yml
name: Build GARNET Android APK

# Runs automatically whenever this repo is updated (push), and can also
# be triggered manually from GitHub's "Actions" tab via workflow_dispatch
# -- useful for re-running a build without needing to push a new commit.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Java (required by Gradle/Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # The finished APK is uploaded as a downloadable "artifact" --
      # found under this workflow run's Summary page, in an "Artifacts"
      # section, once the build finishes (usually a few minutes).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: garnet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
```
